services:
  collector:
    environment:
      AEGIS_THREAT_CONTEXT_FILE: /threat-context/feed.json
      AEGIS_THREAT_CONTEXT_MAX_BYTES: ${AEGIS_THREAT_CONTEXT_MAX_BYTES:-20971520}
      AEGIS_THREAT_CONTEXT_MAX_INDICATORS: ${AEGIS_THREAT_CONTEXT_MAX_INDICATORS:-100000}
      AEGIS_THREAT_CONTEXT_MAX_MATCHES: ${AEGIS_THREAT_CONTEXT_MAX_MATCHES:-32}
      AEGIS_THREAT_CONTEXT_ADAPTER_FILE: ${AEGIS_THREAT_CONTEXT_ADAPTER_FILE:-}
      AEGIS_THREAT_CONTEXT_ADAPTER_JSON: ${AEGIS_THREAT_CONTEXT_ADAPTER_JSON:-}
    volumes:
      - type: bind
        source: ${AEGIS_THREAT_CONTEXT_DIR:-./threat-context}
        target: /threat-context
        read_only: true
