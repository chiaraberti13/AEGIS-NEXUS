[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-nexus"
version = "0.2.0"
description = "Honeypot telemetry, SOC analysis and study lab"
requires-python = ">=3.12"
dependencies = [
  "Flask>=3.1,<4",
  "gunicorn>=23,<24",
  "geoip2>=5.3,<6",
  "paramiko>=3.5,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10"]
# Optional PostgreSQL backend (Cycle H / ADR 0002). SQLite stays the default;
# install with `pip install '.[postgres]'` to use PostgresBackend.
postgres = ["psycopg[binary]>=3.2,<4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aegis_nexus = ["static/*.js", "static/*.css", "templates/*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

# Lint gate: high-signal correctness rules (pyflakes, syntax, bugbear) over the
# whole tree. Stylistic rules (line length etc.) are intentionally not enforced.
# Run with `ruff check` or `make lint`.
[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["F", "E9", "B"]

# Static type-checking gate. Introduced over a curated set of core modules that
# already type-check cleanly; the set is expanded as more modules are annotated.
# Run with `mypy` (no args) or `make typecheck`.
[tool.mypy]
python_version = "3.12"
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true
files = [
  "src/aegis_nexus/storage_backend.py",
  "src/aegis_nexus/metrics.py",
  "src/aegis_nexus/redaction.py",
  "src/aegis_nexus/evidence_bundle.py",
  "src/aegis_nexus/soc_summary.py",
  "src/aegis_nexus/detection_coverage.py",
  "src/aegis_nexus/pdf.py",
  "src/aegis_nexus/logging_config.py",
  "src/aegis_nexus/pagination.py",
  "src/aegis_nexus/time_integrity.py",
  "src/aegis_nexus/security.py",
  "src/aegis_nexus/detection.py",
  "src/aegis_nexus/detection_config.py",
  "src/aegis_nexus/detection_backtest.py",
  "src/aegis_nexus/event_chain.py",
  "src/aegis_nexus/sensor_sequence.py",
  "src/aegis_nexus/casework.py",
  "src/aegis_nexus/ioc.py",
  "src/aegis_nexus/derivation.py",
  "src/aegis_nexus/honeytokens.py",
  "src/aegis_nexus/network_evidence.py",
  "src/aegis_nexus/store_relations.py",
  "src/aegis_nexus/store_common.py",
]
