x-sensor-hardening: &sensor-hardening
  read_only: true
  tmpfs:
    - /tmp:size=16m,noexec,nosuid,nodev
  cap_drop: ["ALL"]
  security_opt:
    - no-new-privileges:true
  pids_limit: 128
  mem_limit: 192m
  cpus: 0.50
  ulimits:
    nofile:
      soft: 1024
      hard: 1024
  restart: unless-stopped

x-sensor-env: &sensor-env
  AEGIS_COLLECTOR_URL: http://collector:8600/api/v1/events
  AEGIS_SENSOR_TIMEOUT: ${AEGIS_SENSOR_TIMEOUT:-2.0}
  AEGIS_SIGN_SENSOR_REQUESTS: ${AEGIS_SIGN_SENSOR_REQUESTS:-true}
  AEGIS_SENSOR_MAX_CONNECTIONS: ${AEGIS_SENSOR_MAX_CONNECTIONS:-32}
  AEGIS_SENSOR_HEARTBEAT_INTERVAL_SECONDS: ${AEGIS_SENSOR_HEARTBEAT_INTERVAL_SECONDS:-60}
  AEGIS_DECOY_PERSONA_JSON: ${AEGIS_DECOY_PERSONA_JSON:-}
  AEGIS_DECOY_PERSONA_SEED: ${AEGIS_DECOY_PERSONA_SEED:-}
  AEGIS_HONEYTOKEN_SEED: ${AEGIS_HONEYTOKEN_SEED:-}

services:
  collector:
    build: .
    environment:
      AEGIS_DATABASE_PATH: ${AEGIS_DATABASE_PATH:-/data/aegis.db}
      AEGIS_INGEST_API_KEY: ${AEGIS_INGEST_API_KEY:-}
      AEGIS_SENSOR_KEYS: >-
        {"ssh-decoy-01":"${AEGIS_SSH_SENSOR_API_KEY:?set AEGIS_SSH_SENSOR_API_KEY in .env}","web-decoy-01":"${AEGIS_WEB_SENSOR_API_KEY:?set AEGIS_WEB_SENSOR_API_KEY in .env}","legacy-decoy-01":"${AEGIS_LEGACY_SENSOR_API_KEY:?set AEGIS_LEGACY_SENSOR_API_KEY in .env}","smtp-decoy-01":"${AEGIS_SMTP_SENSOR_API_KEY:?set AEGIS_SMTP_SENSOR_API_KEY in .env}","redis-decoy-01":"${AEGIS_REDIS_SENSOR_API_KEY:?set AEGIS_REDIS_SENSOR_API_KEY in .env}","mysql-decoy-01":"${AEGIS_MYSQL_SENSOR_API_KEY:?set AEGIS_MYSQL_SENSOR_API_KEY in .env}","smb-decoy-01":"${AEGIS_SMB_SENSOR_API_KEY:?set AEGIS_SMB_SENSOR_API_KEY in .env}","generic-tcp-decoy-01":"${AEGIS_GENERIC_SENSOR_API_KEY:-}","suricata-01":"${AEGIS_SURICATA_SENSOR_API_KEY:-}"}
      AEGIS_SENSOR_SOURCE_CIDRS: >-
        {"ssh-decoy-01":"${AEGIS_SSH_MGMT_SUBNET:-172.31.101.0/24}","web-decoy-01":"${AEGIS_WEB_MGMT_SUBNET:-172.31.102.0/24}","legacy-decoy-01":"${AEGIS_LEGACY_MGMT_SUBNET:-172.31.103.0/24}","smtp-decoy-01":"${AEGIS_SMTP_MGMT_SUBNET:-172.31.104.0/24}","redis-decoy-01":"${AEGIS_REDIS_MGMT_SUBNET:-172.31.105.0/24}","mysql-decoy-01":"${AEGIS_MYSQL_MGMT_SUBNET:-172.31.106.0/24}","smb-decoy-01":"${AEGIS_SMB_MGMT_SUBNET:-172.31.107.0/24}","generic-tcp-decoy-01":"${AEGIS_GENERIC_MGMT_SUBNET:-172.31.108.0/24}"}
      AEGIS_OPERATOR_API_KEY: ${AEGIS_OPERATOR_API_KEY:?set AEGIS_OPERATOR_API_KEY in .env}
      AEGIS_REQUIRE_SENSOR_SIGNATURE: ${AEGIS_REQUIRE_SENSOR_SIGNATURE:-true}
      AEGIS_SENSOR_SIGNATURE_MAX_SKEW: ${AEGIS_SENSOR_SIGNATURE_MAX_SKEW:-300}
      AEGIS_SENSOR_HEARTBEAT_STALE_SECONDS: ${AEGIS_SENSOR_HEARTBEAT_STALE_SECONDS:-180}
      AEGIS_INGEST_RATE_LIMIT_PER_MINUTE: ${AEGIS_INGEST_RATE_LIMIT_PER_MINUTE:-600}
      AEGIS_OPERATOR_RATE_LIMIT_PER_MINUTE: ${AEGIS_OPERATOR_RATE_LIMIT_PER_MINUTE:-1200}
      AEGIS_MAX_DB_EVENTS: ${AEGIS_MAX_DB_EVENTS:-500000}
      AEGIS_ANALYTICS_MAX_EVENTS: ${AEGIS_ANALYTICS_MAX_EVENTS:-20000}
      AEGIS_SESSION_MAX_EVENTS: ${AEGIS_SESSION_MAX_EVENTS:-5000}
      AEGIS_RELATION_MAX_NODES: ${AEGIS_RELATION_MAX_NODES:-160}
      AEGIS_SESSION_GAP_MINUTES: ${AEGIS_SESSION_GAP_MINUTES:-15}
      AEGIS_MIN_FREE_BYTES: ${AEGIS_MIN_FREE_BYTES:-67108864}
      AEGIS_MAX_CASES: ${AEGIS_MAX_CASES:-10000}
      AEGIS_CASE_RETENTION_DAYS: ${AEGIS_CASE_RETENTION_DAYS:-0}
      AEGIS_MAX_EVENT_BYTES: ${AEGIS_MAX_EVENT_BYTES:-65536}
      AEGIS_RETENTION_DAYS: ${AEGIS_RETENTION_DAYS:-30}
      AEGIS_MAX_FUTURE_EVENT_SKEW_SECONDS: ${AEGIS_MAX_FUTURE_EVENT_SKEW_SECONDS:-300}
      AEGIS_STORE_CREDENTIAL_SECRETS: ${AEGIS_STORE_CREDENTIAL_SECRETS:-false}
      AEGIS_HONEYTOKEN_SEED: ${AEGIS_HONEYTOKEN_SEED:-}
      AEGIS_PCAP_ENABLED: ${AEGIS_PCAP_ENABLED:-false}
      AEGIS_PCAP_DIR: ${AEGIS_PCAP_DIR:-/data/pcap}
      AEGIS_PCAP_MAX_BYTES: ${AEGIS_PCAP_MAX_BYTES:-1048576}
      AEGIS_PCAP_RETENTION_DAYS: ${AEGIS_PCAP_RETENTION_DAYS:-7}
      AEGIS_PCAP_MAX_FILES: ${AEGIS_PCAP_MAX_FILES:-1000}
    ports:
      - "127.0.0.1:8600:8600"
    volumes:
      - aegis-data:/data
    networks:
      - ssh_mgmt
      - web_mgmt
      - legacy_mgmt
      - smtp_mgmt
      - redis_mgmt
      - mysql_mgmt
      - smb_mgmt
      - generic_mgmt
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 512m
    cpus: 1.00
    ulimits:
      nofile:
        soft: 2048
        hard: 2048
    restart: unless-stopped

  ssh-decoy:
    <<: *sensor-hardening
    build: .
    command: ["python", "-m", "aegis_nexus.sensors.ssh_decoy"]
    environment:
      <<: *sensor-env
      AEGIS_SENSOR_API_KEY: ${AEGIS_SSH_SENSOR_API_KEY:?set AEGIS_SSH_SENSOR_API_KEY in .env}
      AEGIS_HONEYPOT_ID: ssh-decoy-01
      AEGIS_SSH_PORT: "2222"
    ports:
      - "${AEGIS_PUBLIC_SSH_PORT:-2222}:2222"
    networks:
      - ssh_exposure
      - ssh_mgmt
    depends_on:
      - collector

  web-decoy:
    <<: *sensor-hardening
    build: .
    command:
      - gunicorn
      - --bind
      - 0.0.0.0:8080
      - --workers
      - "2"
      - --threads
      - "2"
      - --timeout
      - "20"
      - --keep-alive
      - "2"
      - --limit-request-line
      - "2048"
      - --limit-request-fields
      - "40"
      - --limit-request-field_size
      - "4096"
      - --max-requests
      - "1500"
      - --max-requests-jitter
      - "150"
      - aegis_nexus.sensors.web_decoy:app
    environment:
      <<: *sensor-env
      AEGIS_SENSOR_API_KEY: ${AEGIS_WEB_SENSOR_API_KEY:?set AEGIS_WEB_SENSOR_API_KEY in .env}
      AEGIS_HONEYPOT_ID: web-decoy-01
      AEGIS_WEB_PORT: "8080"
    ports:
      - "${AEGIS_PUBLIC_WEB_PORT:-8080}:8080"
    networks:
      - web_exposure
      - web_mgmt
    depends_on:
      - collector

  legacy-decoy:
    <<: *sensor-hardening
    build: .
    command: ["python", "-m", "aegis_nexus.sensors.legacy"]
    environment:
      <<: *sensor-env
      AEGIS_SENSOR_API_KEY: ${AEGIS_LEGACY_SENSOR_API_KEY:?set AEGIS_LEGACY_SENSOR_API_KEY in .env}
      AEGIS_HONEYPOT_ID: legacy-decoy-01
      AEGIS_FTP_PORT: "2121"
      AEGIS_TELNET_PORT: "2323"
    ports:
      - "${AEGIS_PUBLIC_FTP_PORT:-2121}:2121"
      - "${AEGIS_PUBLIC_TELNET_PORT:-2323}:2323"
    networks:
      - legacy_exposure
      - legacy_mgmt
    depends_on:
      - collector


  smtp-decoy:
    <<: *sensor-hardening
    build: .
    command: ["python", "-m", "aegis_nexus.sensors.smtp_decoy"]
    environment:
      <<: *sensor-env
      AEGIS_SENSOR_API_KEY: ${AEGIS_SMTP_SENSOR_API_KEY:?set AEGIS_SMTP_SENSOR_API_KEY in .env}
      AEGIS_HONEYPOT_ID: smtp-decoy-01
      AEGIS_SMTP_PORT: "2525"
    ports:
      - "${AEGIS_PUBLIC_SMTP_PORT:-2525}:2525"
    networks:
      - smtp_exposure
      - smtp_mgmt
    depends_on:
      - collector


  redis-decoy:
    <<: *sensor-hardening
    build: .
    command: ["python", "-m", "aegis_nexus.sensors.redis_decoy"]
    environment:
      <<: *sensor-env
      AEGIS_SENSOR_API_KEY: ${AEGIS_REDIS_SENSOR_API_KEY:?set AEGIS_REDIS_SENSOR_API_KEY in .env}
      AEGIS_HONEYPOT_ID: redis-decoy-01
      AEGIS_REDIS_PORT: "6379"
    ports:
      - "${AEGIS_PUBLIC_REDIS_PORT:-6379}:6379"
    networks:
      - redis_exposure
      - redis_mgmt
    depends_on:
      - collector


  mysql-decoy:
    <<: *sensor-hardening
    build: .
    command: ["python", "-m", "aegis_nexus.sensors.mysql_decoy"]
    environment:
      <<: *sensor-env
      AEGIS_SENSOR_API_KEY: ${AEGIS_MYSQL_SENSOR_API_KEY:?set AEGIS_MYSQL_SENSOR_API_KEY in .env}
      AEGIS_HONEYPOT_ID: mysql-decoy-01
      AEGIS_MYSQL_PORT: "3306"
    ports:
      - "${AEGIS_PUBLIC_MYSQL_PORT:-3306}:3306"
    networks:
      - mysql_exposure
      - mysql_mgmt
    depends_on:
      - collector


  smb-decoy:
    <<: *sensor-hardening
    build: .
    command: ["python", "-m", "aegis_nexus.sensors.smb_decoy"]
    environment:
      <<: *sensor-env
      AEGIS_SENSOR_API_KEY: ${AEGIS_SMB_SENSOR_API_KEY:?set AEGIS_SMB_SENSOR_API_KEY in .env}
      AEGIS_HONEYPOT_ID: smb-decoy-01
      AEGIS_SMB_PORT: "445"
    ports:
      - "${AEGIS_PUBLIC_SMB_PORT:-445}:445"
    networks:
      - smb_exposure
      - smb_mgmt
    depends_on:
      - collector


  generic-tcp-decoy:
    <<: *sensor-hardening
    profiles: ["generic"]
    build: .
    command:
      - sh
      - -c
      - 'test -n "$AEGIS_SENSOR_API_KEY" || { echo "Set AEGIS_GENERIC_SENSOR_API_KEY before enabling the generic profile" >&2; exit 1; }; exec python -m aegis_nexus.sensors.generic_tcp'
    environment:
      <<: *sensor-env
      AEGIS_SENSOR_API_KEY: ${AEGIS_GENERIC_SENSOR_API_KEY:-}
      AEGIS_HONEYPOT_ID: generic-tcp-decoy-01
      AEGIS_GENERIC_TCP_PORT: "9000"
      AEGIS_GENERIC_TCP_BANNER: ${AEGIS_GENERIC_TCP_BANNER:-Service ready}
    ports:
      - "${AEGIS_PUBLIC_GENERIC_TCP_PORT:-9000}:9000"
    networks:
      - generic_exposure
      - generic_mgmt
    depends_on:
      - collector


  backup:
    build: .
    profiles: ["ops"]
    network_mode: "none"
    command: ["python", "scripts/backup.py"]
    environment:
      AEGIS_DATABASE_PATH: ${AEGIS_DATABASE_PATH:-/data/aegis.db}
      AEGIS_BACKUP_DIR: ${AEGIS_BACKUP_DIR:-/data/backups}
      AEGIS_BACKUP_KEEP: ${AEGIS_BACKUP_KEEP:-14}
    volumes:
      - aegis-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=8m,noexec,nosuid,nodev
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    pids_limit: 32
    mem_limit: 128m

networks:
  ssh_exposure:
    ipam:
      config:
        - subnet: "${AEGIS_SSH_EXPOSURE_SUBNET:-172.30.101.0/24}"
  web_exposure:
    ipam:
      config:
        - subnet: "${AEGIS_WEB_EXPOSURE_SUBNET:-172.30.102.0/24}"
  legacy_exposure:
    ipam:
      config:
        - subnet: "${AEGIS_LEGACY_EXPOSURE_SUBNET:-172.30.103.0/24}"
  smtp_exposure:
    ipam:
      config:
        - subnet: "${AEGIS_SMTP_EXPOSURE_SUBNET:-172.30.104.0/24}"
  redis_exposure:
    ipam:
      config:
        - subnet: "${AEGIS_REDIS_EXPOSURE_SUBNET:-172.30.105.0/24}"
  mysql_exposure:
    ipam:
      config:
        - subnet: "${AEGIS_MYSQL_EXPOSURE_SUBNET:-172.30.106.0/24}"
  smb_exposure:
    ipam:
      config:
        - subnet: "${AEGIS_SMB_EXPOSURE_SUBNET:-172.30.107.0/24}"
  generic_exposure:
    ipam:
      config:
        - subnet: "${AEGIS_GENERIC_EXPOSURE_SUBNET:-172.30.108.0/24}"
  ssh_mgmt:
    internal: true
    ipam:
      config:
        - subnet: "${AEGIS_SSH_MGMT_SUBNET:-172.31.101.0/24}"
  web_mgmt:
    internal: true
    ipam:
      config:
        - subnet: "${AEGIS_WEB_MGMT_SUBNET:-172.31.102.0/24}"
  legacy_mgmt:
    internal: true
    ipam:
      config:
        - subnet: "${AEGIS_LEGACY_MGMT_SUBNET:-172.31.103.0/24}"
  smtp_mgmt:
    internal: true
    ipam:
      config:
        - subnet: "${AEGIS_SMTP_MGMT_SUBNET:-172.31.104.0/24}"
  redis_mgmt:
    internal: true
    ipam:
      config:
        - subnet: "${AEGIS_REDIS_MGMT_SUBNET:-172.31.105.0/24}"
  mysql_mgmt:
    internal: true
    ipam:
      config:
        - subnet: "${AEGIS_MYSQL_MGMT_SUBNET:-172.31.106.0/24}"
  smb_mgmt:
    internal: true
    ipam:
      config:
        - subnet: "${AEGIS_SMB_MGMT_SUBNET:-172.31.107.0/24}"
  generic_mgmt:
    internal: true
    ipam:
      config:
        - subnet: "${AEGIS_GENERIC_MGMT_SUBNET:-172.31.108.0/24}"

volumes:
  aegis-data:
