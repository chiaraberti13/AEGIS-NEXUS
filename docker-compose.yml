x-sensor-hardening: &sensor-hardening
  read_only: true
  tmpfs:
    - /tmp:size=16m,noexec,nosuid,nodev
  cap_drop: ["ALL"]
  security_opt:
    - no-new-privileges:true
  pids_limit: 128
  mem_limit: 192m
  cpus: 0.50
  restart: unless-stopped

x-sensor-env: &sensor-env
  AEGIS_COLLECTOR_URL: http://collector:8600/api/v1/events
  AEGIS_INGEST_API_KEY: ${AEGIS_INGEST_API_KEY:?set AEGIS_INGEST_API_KEY in .env}
  AEGIS_SENSOR_TIMEOUT: ${AEGIS_SENSOR_TIMEOUT:-2.0}

services:
  collector:
    build: .
    environment:
      AEGIS_DATABASE_PATH: /data/aegis.db
      AEGIS_INGEST_API_KEY: ${AEGIS_INGEST_API_KEY:?set AEGIS_INGEST_API_KEY in .env}
      AEGIS_MAX_EVENT_BYTES: ${AEGIS_MAX_EVENT_BYTES:-65536}
      AEGIS_RETENTION_DAYS: ${AEGIS_RETENTION_DAYS:-30}
      AEGIS_STORE_CREDENTIAL_SECRETS: ${AEGIS_STORE_CREDENTIAL_SECRETS:-false}
    ports:
      - "127.0.0.1:8600:8600"
    volumes:
      - aegis-data:/data
    networks:
      - aegis_mgmt
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 512m
    restart: unless-stopped

  ssh-decoy:
    <<: *sensor-hardening
    build: .
    command: ["python", "-m", "aegis_nexus.sensors.ssh_decoy"]
    environment:
      <<: *sensor-env
      AEGIS_HONEYPOT_ID: ssh-decoy-01
      AEGIS_SSH_PORT: "2222"
    ports:
      - "${AEGIS_PUBLIC_SSH_PORT:-2222}:2222"
    networks:
      - aegis_dmz
      - aegis_mgmt
    depends_on:
      - collector

  web-decoy:
    <<: *sensor-hardening
    build: .
    command: ["gunicorn", "--bind", "0.0.0.0:8080", "--workers", "2", "--threads", "2", "--timeout", "20", "aegis_nexus.sensors.web_decoy:app"]
    environment:
      <<: *sensor-env
      AEGIS_HONEYPOT_ID: web-decoy-01
      AEGIS_WEB_PORT: "8080"
    ports:
      - "${AEGIS_PUBLIC_WEB_PORT:-8080}:8080"
    networks:
      - aegis_dmz
      - aegis_mgmt
    depends_on:
      - collector

  legacy-decoy:
    <<: *sensor-hardening
    build: .
    command: ["python", "-m", "aegis_nexus.sensors.legacy"]
    environment:
      <<: *sensor-env
      AEGIS_HONEYPOT_ID: legacy-decoy-01
      AEGIS_FTP_PORT: "2121"
      AEGIS_TELNET_PORT: "2323"
    ports:
      - "${AEGIS_PUBLIC_FTP_PORT:-2121}:2121"
      - "${AEGIS_PUBLIC_TELNET_PORT:-2323}:2323"
    networks:
      - aegis_dmz
      - aegis_mgmt
    depends_on:
      - collector

networks:
  aegis_dmz:
  aegis_mgmt:
    internal: true

volumes:
  aegis-data:
