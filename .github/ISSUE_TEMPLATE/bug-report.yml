name: Segnalazione di un bug
description: Descrivi un comportamento errato e come riprodurlo.
body:
- type: markdown
  attributes:
    value: Segnalazione per AEGIS-NEXUS. Non inserire dati personali o segreti. Per vulnerabilità consulta
      https://github.com/chiaraberti13/AEGIS-NEXUS/security/policy.
- type: textarea
  id: problem
  attributes:
    label: Problema
    description: Descrivi il comportamento osservato e il suo impatto.
  validations:
    required: true
- type: textarea
  id: steps
  attributes:
    label: Passaggi per riprodurre
    description: Usa un esempio minimo e dati sintetici.
  validations:
    required: true
- type: textarea
  id: expected
  attributes:
    label: Risultato atteso
    description: Spiega cosa dovrebbe accadere.
  validations:
    required: true
- type: textarea
  id: environment
  attributes:
    label: Versione e ambiente
    description: Versione Python, sensore o vista SOC, browser e telemetria sintetica priva di dati reali.
  validations:
    required: true
- type: textarea
  id: evidence
  attributes:
    label: Log o schermate
    description: Rimuovi credenziali, dati personali e informazioni riservate.
  validations:
    required: false
