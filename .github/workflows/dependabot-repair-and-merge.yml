name: Dependabot repair and merge

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_run:
    types: [completed]

permissions:
  actions: read
  checks: read
  contents: read
  issues: write
  pull-requests: write
  statuses: read

jobs:
  gate:
    name: Dependabot repair and merge
    if: github.event_name != 'workflow_run' || github.event.workflow_run.name != 'Dependabot repair and merge'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const event = context.payload;
            const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

            if (context.eventName === "workflow_run" &&
                event.workflow_run?.name === "Dependabot repair and merge") {
              core.notice("Ignoring this workflow's own completion event.");
              return;
            }

            const repository = await github.rest.repos.get({ owner, repo });
            const defaultBranch = repository.data.default_branch;
            let pullNumber = event.pull_request?.number;

            if (!pullNumber) {
              const run = event.workflow_run;
              const candidates = run?.pull_requests || [];
              const match = candidates.find(p => p.base?.ref === defaultBranch);
              if (match) {
                pullNumber = match.number;
              } else if (run?.head_branch?.startsWith("dependabot/")) {
                const found = await github.rest.pulls.list({
                  owner, repo, state: "open", per_page: 100,
                  head: owner + ":" + run.head_branch
                });
                const pr = found.data.find(p => p.base.ref === defaultBranch);
                pullNumber = pr?.number;
              }
            }

            if (!pullNumber) {
              core.notice("No open Dependabot pull request is associated with this event.");
              return;
            }

            const initial = await github.rest.pulls.get({
              owner, repo, pull_number: pullNumber
            });
            if (initial.data.user.login !== "dependabot[bot]" ||
                initial.data.base.ref !== defaultBranch ||
                initial.data.draft ||
                initial.data.state !== "open") {
              core.notice("This is not an open, ready Dependabot pull request for the default branch.");
              return;
            }

            const headSha = initial.data.head.sha;
            const workflowRun = event.workflow_run;
            if (workflowRun?.head_branch &&
                workflowRun.head_branch !== initial.data.head.ref) {
              core.notice("The completed workflow belongs to an older or different branch.");
              return;
            }

            let snapshot;
            let previousSignature = null;
            let stableCount = 0;
            const maxPolls = context.eventName === "pull_request_target" ? 30 : 20;

            for (let attempt = 0; attempt < maxPolls; attempt++) {
              const current = await github.rest.pulls.get({
                owner, repo, pull_number: pullNumber
              });
              if (current.data.state !== "open" || current.data.head.sha !== headSha) {
                core.notice("The pull request changed while checks were being collected.");
                return;
              }

              const [checksResponse, statusesResponse] = await Promise.all([
                github.rest.checks.listForRef({
                  owner, repo, ref: headSha, per_page: 100
                }),
                github.rest.repos.listCommitStatusesForRef({
                  owner, repo, ref: headSha, per_page: 100
                })
              ]);

              const checkRuns = checksResponse.data.check_runs.filter(
                check => !check.name.startsWith("Dependabot repair and merge")
              );
              const statuses = statusesResponse.data;
              const pendingChecks = checkRuns.some(check => check.status !== "completed");
              const pendingStatuses = statusesResponse.data.length > 0 &&
                statusesResponse.data.some(status => status.state === "pending");
              const pending = pendingChecks || pendingStatuses;

              const signature = JSON.stringify({
                checks: checkRuns.map(c => [c.id, c.status, c.conclusion]).sort(),
                statuses: statuses.map(s => [s.context, s.state, s.updated_at]).sort()
              });

              if (pending) {
                stableCount = 0;
                previousSignature = signature;
              } else if (signature === previousSignature) {
                stableCount++;
              } else {
                previousSignature = signature;
                stableCount = 1;
              }

              const noChecks = checkRuns.length === 0 && statuses.length === 0;
              const requiredStableCount = noChecks ? 4 : 2;
              if (!pending && stableCount >= requiredStableCount) {
                snapshot = { checkRuns, statuses };
                break;
              }

              if (attempt < maxPolls - 1) await sleep(30000);
            }

            if (!snapshot) {
              core.notice("Checks did not settle in time; the pull request remains open.");
              return;
            }

            const accepted = new Set(["success", "neutral", "skipped"]);
            const failedChecks = snapshot.checkRuns.filter(
              check => !accepted.has(check.conclusion)
            );
            const failedStatuses = snapshot.statuses.filter(
              status => status.state !== "success"
            );

            if (failedChecks.length || failedStatuses.length) {
              const comments = await github.paginate(
                github.rest.issues.listComments,
                { owner, repo, issue_number: pullNumber, per_page: 100 }
              );
              const marker = "<!-- dependabot-repair-request:" + headSha + " -->";
              if (comments.some(comment => comment.body?.includes(marker))) {
                core.notice("A repair request was already sent for this commit.");
                return;
              }

              const repairRequests = comments.filter(comment =>
                comment.body?.includes("<!-- dependabot-repair-request:")
              ).length;
              if (repairRequests >= 2) {
                core.warning("The automatic repair limit was reached; leaving this PR open for review.");
                return;
              }

              const failures = [
                ...failedChecks.map(c => "- " + c.name + ": " + (c.conclusion || c.status)),
                ...failedStatuses.map(s => "- " + s.context + ": " + s.state)
              ].slice(0, 20).join("\n");

              await github.rest.issues.createComment({
                owner, repo, issue_number: pullNumber,
                body: marker + "\n@copilot Please diagnose and fix these failing CI checks on this Dependabot pull request. Make only a targeted correction on this PR branch, do not disable or bypass checks, and rerun the affected checks.\n\n" +
                  "Failed checks:\n" + failures
              });
              core.notice("Asked Copilot to repair the failing checks. The PR will stay open until checks pass.");
              return;
            }

            const latest = await github.rest.pulls.get({
              owner, repo, pull_number: pullNumber
            });
            if (latest.data.state !== "open" || latest.data.head.sha !== headSha) {
              core.notice("The pull request changed before merge; no merge was attempted.");
              return;
            }

            const merged = await github.rest.pulls.merge({
              owner, repo, pull_number: pullNumber, sha: headSha,
              merge_method: "squash"
            });
            if (!merged.data.merged) {
              core.setFailed("GitHub did not merge the Dependabot pull request.");
              return;
            }
            core.notice("All checks passed. Dependabot changes were merged into the default branch.");
