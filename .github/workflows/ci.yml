name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: python -m compileall -q src
      - run: python -m py_compile scripts/smoke_test.py scripts/send_suricata_event.py scripts/backup.py
      - run: bash -n scripts/egress_guard.sh
      - run: bash scripts/egress_guard.sh validate
      - run: '! AEGIS_SSH_EXPOSURE_SUBNET=999.0.0.0/24 bash scripts/egress_guard.sh validate'
      - run: make -n install test run up down ps smoke logs backup egress-validate egress-guard egress-status egress-remove
      - run: node --check src/aegis_nexus/static/app.js
      - run: node --check src/aegis_nexus/static/i18n.js
      - run: pytest -q
      - run: AEGIS_SSH_SENSOR_API_KEY=ci-ssh-secret AEGIS_WEB_SENSOR_API_KEY=ci-web-secret AEGIS_LEGACY_SENSOR_API_KEY=ci-legacy-secret AEGIS_SMTP_SENSOR_API_KEY=ci-smtp-secret AEGIS_REDIS_SENSOR_API_KEY=ci-redis-secret AEGIS_MYSQL_SENSOR_API_KEY=ci-mysql-secret AEGIS_SMB_SENSOR_API_KEY=ci-smb-secret AEGIS_OPERATOR_API_KEY=ci-operator-secret docker compose config -q
      - run: AEGIS_SSH_SENSOR_API_KEY=ci-ssh-secret AEGIS_WEB_SENSOR_API_KEY=ci-web-secret AEGIS_LEGACY_SENSOR_API_KEY=ci-legacy-secret AEGIS_SMTP_SENSOR_API_KEY=ci-smtp-secret AEGIS_REDIS_SENSOR_API_KEY=ci-redis-secret AEGIS_MYSQL_SENSOR_API_KEY=ci-mysql-secret AEGIS_SMB_SENSOR_API_KEY=ci-smb-secret AEGIS_OPERATOR_API_KEY=ci-operator-secret docker compose -f docker-compose.yml -f docker-compose.geoip.yml config -q
      - run: AEGIS_SSH_SENSOR_API_KEY=ci-ssh-secret AEGIS_WEB_SENSOR_API_KEY=ci-web-secret AEGIS_LEGACY_SENSOR_API_KEY=ci-legacy-secret AEGIS_SMTP_SENSOR_API_KEY=ci-smtp-secret AEGIS_REDIS_SENSOR_API_KEY=ci-redis-secret AEGIS_MYSQL_SENSOR_API_KEY=ci-mysql-secret AEGIS_SMB_SENSOR_API_KEY=ci-smb-secret AEGIS_OPERATOR_API_KEY=ci-operator-secret docker compose -f docker-compose.yml -f docker-compose.threat-context.yml config -q
      - run: docker build -t aegis-nexus:ci .
