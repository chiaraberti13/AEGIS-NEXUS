name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege by default; jobs opt into more only where needed.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"  # matches the Dockerfile base image

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: aegis
          POSTGRES_DB: aegis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Exercises the optional PostgreSQL backend in the cross-backend
      # compatibility suite (tests/test_backend_compatibility.py).
      AEGIS_TEST_POSTGRES_DSN: "host=127.0.0.1 port=5432 user=aegis password=aegis dbname=aegis_test"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install project (runtime + dev + postgres deps)
        run: pip install -e '.[dev,postgres]'
      - name: Syntax compile (src + scripts)
        run: |
          python -m compileall -q src
          python -m py_compile scripts/*.py
      - name: Shell + egress-guard syntax
        run: |
          bash -n scripts/egress_guard.sh
          bash scripts/egress_guard.sh validate
      - name: Frontend syntax (node --check)
        run: |
          node --check src/aegis_nexus/static/app.js
          node --check src/aegis_nexus/static/core.js
          node --check src/aegis_nexus/static/i18n.js
      - name: pytest
        run: pytest -q

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff==0.8.6
      - run: ruff check src tests scripts

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install project + mypy
        run: |
          pip install -e '.[dev]'
          pip install mypy==1.14.1
      - run: mypy

  sast:
    name: SAST (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install bandit==1.8.0
      - name: bandit (reviewed baseline)
        run: bandit -r src --baseline .bandit-baseline.json

  dependency-audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install pip-audit==2.7.3
      - name: Audit the hash-locked runtime dependencies
        # PYSEC-2026-2858 (paramiko SHA-1 in rsakey.py) is accepted with no
        # fixed release yet: paramiko runs server-side in the SSH decoy, not as
        # a client verifying trusted signatures — not exploitable in the
        # honeypot threat model. See docs/SUPPLY_CHAIN.md (triage). Drop the
        # ignore when a fixed paramiko release ships.
        run: pip-audit --requirement requirements.lock --ignore-vuln PYSEC-2026-2858

  secret-scan:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Generate CycloneDX SBOM
        run: python scripts/generate_sbom.py --reproducible --output sbom.cdx.json
      - name: Validate SBOM is CycloneDX
        run: |
          python - <<'PY'
          import json
          d = json.load(open("sbom.cdx.json"))
          assert d.get("bomFormat") == "CycloneDX", d.get("bomFormat")
          assert d.get("components"), "SBOM has no components"
          print("SBOM OK:", d["specVersion"], len(d["components"]), "components")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json

  container:
    name: Container build + image scan (Trivy) + compose isolation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Reproducible image build (hash-locked deps)
        run: docker build -t aegis-nexus:ci .
      - name: Prepare compose interpolation env (placeholder keys only)
        run: cp .env.example .env
      - name: Validate every compose profile
        run: |
          docker compose -f docker-compose.yml config >/dev/null
          docker compose -f docker-compose.yml -f docker-compose.geoip.yml config >/dev/null
          docker compose -f docker-compose.yml -f docker-compose.threat-context.yml config >/dev/null
      - name: Verify sensor/collector network isolation (all built-in decoys)
        run: docker compose --profile generic -f docker-compose.yml config --format json | python scripts/verify_compose_isolation.py
      - name: Trivy image vulnerability scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: aegis-nexus:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
