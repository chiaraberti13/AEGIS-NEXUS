name: Dependabot failed-check auto repair

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  check_run:
    types: [completed]

permissions: {}

jobs:
  request-repair:
    if: >-
      (github.event_name == 'check_run' &&
       github.event.check_run.conclusion == 'failure' &&
       github.event.check_run.name != 'request-repair' &&
       github.event.check_run.name != 'Request repair') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'failure')
    runs-on: ubuntu-latest
    permissions:
      checks: read
      issues: write
      pull-requests: read
    steps:
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const run = context.payload.workflow_run;
            const check = context.payload.check_run;
            const headSha = check?.head_sha || run?.head_sha;
            const { owner, repo } = context.repo;
            if (!headSha) return;

            const prs = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: "open", per_page: 100
            });
            const pr = prs.find(item =>
              item.user.login === "dependabot[bot]" &&
              item.head.sha === headSha
            );
            if (!pr) {
              core.notice("No open Dependabot pull request matches this failed check.");
              return;
            }

            const marker = "<!-- dependabot-auto-repair:" + headSha + " -->";
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: pr.number, per_page: 100
            });
            if (comments.some(comment => comment.body?.includes(marker))) {
              core.notice("A repair request already exists for this commit.");
              return;
            }

            let failed = check ? [check.name] : [];
            if (!failed.length) {
              const response = await github.rest.checks.listForRef({
                owner, repo, ref: headSha, per_page: 100
              });
              failed = response.data.check_runs
                .filter(item => item.conclusion === "failure")
                .map(item => item.name);
            }
            const details = failed.length ? failed.join(", ") : (run?.name || "CI");
            await github.rest.issues.createComment({
              owner, repo, issue_number: pr.number,
              body: marker + "\n@copilot Please diagnose and fix the failed check " +
                details + " immediately on this Dependabot pull request. Make only a targeted correction on this PR branch, do not disable or bypass checks, and rerun the affected checks."
            });
            core.notice("Asked Copilot to repair the failed Dependabot check.");

  merge:
    if: >-
      (github.event_name == 'check_run' &&
       github.event.check_run.conclusion == 'success' &&
       github.event.check_run.name != 'request-repair' &&
       github.event.check_run.name != 'merge' &&
       github.event.check_run.name != 'Request repair' &&
       github.event.check_run.name != 'Merge') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    permissions:
      checks: read
      statuses: read
      pull-requests: write
    steps:
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const run = context.payload.workflow_run;
            const check = context.payload.check_run;
            const headSha = check?.head_sha || run?.head_sha;
            const { owner, repo } = context.repo;
            if (!headSha) return;

            const prs = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: "open", per_page: 100
            });
            const pr = prs.find(item =>
              item.user.login === "dependabot[bot]" &&
              item.head.sha === headSha
            );
            if (!pr) return;

            const commits = await github.paginate(github.rest.pulls.listCommits, {
              owner, repo, pull_number: pr.number, per_page: 100
            });
            if (commits.some(commit => commit.author?.login !== "dependabot[bot]")) {
              core.notice("The pull request contains a commit from someone else; leaving it for review.");
              return;
            }

            const [checkResponse, statusResponse] = await Promise.all([
              github.rest.checks.listForRef({ owner, repo, ref: headSha, per_page: 100 }),
              github.rest.repos.listCommitStatusesForRef({ owner, repo, ref: headSha, per_page: 100 })
            ]);
            const checks = checkResponse.data.check_runs.filter(item =>
              item.name !== "request-repair" && item.name !== "merge" &&
              item.name !== "Request repair" && item.name !== "Merge"
            );
            const accepted = new Set(["success", "neutral", "skipped"]);
            const allChecksGreen = checks.length > 0 &&
              checks.every(item => item.status === "completed" && accepted.has(item.conclusion));
            const allStatusesGreen = statusResponse.data.every(item => item.state === "success");
            if (!allChecksGreen || !allStatusesGreen) {
              core.notice("Checks are still pending or one has failed; leaving the pull request open.");
              return;
            }

            const current = await github.rest.pulls.get({
              owner, repo, pull_number: pr.number
            });
            if (current.data.state !== "open" || current.data.head.sha !== headSha) {
              core.notice("The pull request changed; no merge was attempted.");
              return;
            }

            await github.rest.pulls.merge({
              owner, repo, pull_number: pr.number,
              sha: headSha, merge_method: "squash"
            });
            core.notice("All checks passed; merged the Dependabot pull request.");
