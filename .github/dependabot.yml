version: 2
updates:
  # CI actions are pinned to immutable commit SHAs (with a `# vX.Y.Z` comment);
  # Dependabot bumps both the SHA and the version comment on new releases.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci

  # Keep the hash-locked runtime dependencies current; Dependabot regenerates
  # requirements.lock (with hashes) and pyproject constraints.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
