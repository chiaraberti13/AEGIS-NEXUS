<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AEGIS-NEXUS</title><link rel="stylesheet" href="/static/styles.css"></head>
<body><div class="shell">
<aside class="sidebar"><div class="brand"><span class="brand-mark">A</span><div><strong>AEGIS-NEXUS</strong><small data-i18n="brand.subtitle"></small></div></div><nav><button class="nav-item active" data-i18n="nav.dashboard"></button><button class="nav-item" data-i18n="nav.investigate"></button><button class="nav-item" data-i18n="nav.relations"></button><button class="nav-item" data-i18n="nav.study"></button></nav><div class="sidebar-note"><span class="status-dot"></span><span data-i18n="status.live"></span></div></aside>
<main><header class="topbar"><div><p class="eyebrow" data-i18n="header.eyebrow"></p><h1 data-i18n="header.title"></h1></div><div class="top-actions"><label class="search"><span>⌕</span><input id="global-search" type="search" data-i18n-placeholder="search.placeholder" autocomplete="off"></label><select id="window"><option value="24">24h</option><option value="72">72h</option><option value="168">7d</option><option value="720">30d</option></select><button id="lang-toggle" class="compact">EN</button></div></header>
<section class="kpis"><article><span data-i18n="kpi.events"></span><strong id="kpi-events">0</strong></article><article><span data-i18n="kpi.ips"></span><strong id="kpi-ips">0</strong></article><article><span data-i18n="kpi.sessions"></span><strong id="kpi-sessions">0</strong></article><article><span data-i18n="kpi.critical"></span><strong id="kpi-critical">0</strong></article></section>
<section class="grid primary-grid"><article class="panel"><div class="panel-head"><div><span class="eyebrow" data-i18n="panel.timeline.eyebrow"></span><h2 data-i18n="panel.timeline.title"></h2></div><span class="badge">UTC</span></div><svg id="timeline" class="timeline" viewBox="0 0 900 260"></svg></article><article class="panel"><div class="panel-head"><div><span class="eyebrow" data-i18n="panel.map.eyebrow"></span><h2 data-i18n="panel.map.title"></h2></div><span id="map-count" class="badge">0</span></div><svg id="attack-map" class="attack-map" viewBox="0 0 800 390"><g class="land"><path d="M86 85l78-40 86 15 35 55-30 42-71 1-42 54-55-43z"/><path d="M251 226l50 11 28 55-18 70-39-20-27-67z"/><path d="M353 74l90-33 104 16 60 46-23 35-63 2-12 42-75-3-22-45-59-18z"/><path d="M418 188l78 0 43 47-17 90-55 47-44-48-17-79z"/><path d="M616 242l70-14 47 37-21 45-75 2-28-37z"/></g><g id="map-points"></g></svg></article></section>
<section class="grid chart-grid">
<article class="panel"><div class="panel-head"><h3 data-i18n="chart.country"></h3></div><div id="chart-country" class="bar-chart"></div></article><article class="panel"><div class="panel-head"><h3 data-i18n="chart.asn"></h3></div><div id="chart-asn" class="bar-chart"></div></article><article class="panel"><div class="panel-head"><h3 data-i18n="chart.port"></h3></div><div id="chart-port" class="bar-chart"></div></article><article class="panel"><div class="panel-head"><h3 data-i18n="chart.protocol"></h3></div><div id="chart-protocol" class="bar-chart"></div></article><article class="panel"><div class="panel-head"><h3 data-i18n="chart.honeypot"></h3></div><div id="chart-honeypot" class="bar-chart"></div></article><article class="panel"><div class="panel-head"><h3 data-i18n="chart.service"></h3></div><div id="chart-service" class="bar-chart"></div></article><article class="panel"><div class="panel-head"><h3 data-i18n="chart.credentials"></h3></div><div id="chart-credentials" class="bar-chart"></div></article><article class="panel"><div class="panel-head"><h3 data-i18n="chart.commands"></h3></div><div id="chart-commands" class="bar-chart"></div></article><article class="panel"><div class="panel-head"><h3 data-i18n="chart.ids"></h3></div><div id="chart-ids" class="bar-chart"></div></article><article class="panel"><div class="panel-head"><h3 data-i18n="chart.mitre"></h3></div><div id="chart-mitre" class="bar-chart"></div></article>
<article class="panel heatmap-panel"><div class="panel-head"><h3 data-i18n="chart.heatmap"></h3></div><div id="heatmap" class="heatmap"></div></article></section>
<section class="grid feed-grid"><article class="panel"><div class="panel-head"><div><span class="eyebrow" data-i18n="feed.eyebrow"></span><h2 data-i18n="feed.title"></h2></div><span class="pulse"></span></div><div class="table-wrap"><table><thead><tr><th data-i18n="table.time"></th><th data-i18n="table.source"></th><th data-i18n="table.type"></th><th data-i18n="table.service"></th><th data-i18n="table.severity"></th></tr></thead><tbody id="event-feed"></tbody></table></div></article>
<article class="panel"><div class="panel-head"><div><span class="eyebrow" data-i18n="details.eyebrow"></span><h2 data-i18n="details.title"></h2></div></div><div id="event-empty" class="empty" data-i18n="details.empty"></div><div id="event-details" hidden><div class="detail-actions"><button id="open-ip" class="compact" data-i18n="details.ip"></button><button id="open-session" class="compact" data-i18n="details.session"></button><button id="open-relations" class="compact" data-i18n="details.relations"></button><button id="open-report" class="compact" data-i18n="details.report"></button></div><div class="provenance-grid"><section><span class="provenance observed" data-i18n="provenance.observed"></span><pre id="detail-observed"></pre></section><section><span class="provenance enrichment" data-i18n="provenance.enrichment"></span><pre id="detail-enrichment"></pre></section><section><span class="provenance derived" data-i18n="provenance.derived"></span><pre id="detail-derived"></pre></section><section><span class="provenance hypotheses" data-i18n="provenance.hypotheses"></span><pre id="detail-hypotheses"></pre></section></div><section class="study-card"><span class="provenance study" data-i18n="nav.study"></span><h3 id="study-title"></h3><p id="study-why"></p><ul id="study-list"></ul></section><section><div class="panel-head"><h3 data-i18n="relations.title"></h3></div><svg id="relation-graph" viewBox="0 0 720 330" class="relation-graph"></svg></section></div></article></section>
</main></div><script src="/static/i18n.js"></script><script src="/static/app.js"></script></body></html>
